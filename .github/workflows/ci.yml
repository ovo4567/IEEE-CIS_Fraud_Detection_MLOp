# CI/CD (ticket 10): one workflow, two jobs.
#
# `ci` — on every push and pull request: ruff, the feature-contract check, the
# full test suite, and a Compose-manifest validation. Runs on the committed
# seed artifact alone — no DVC pull, no registry auth — so a fresh clone is
# fully exercised offline.
#
# `cd` — after CI succeeds, only on pushes to the default branch: build the
# serving image and publish it to GHCR tagged by commit (`sha-<short>` +
# `latest`). `needs: ci` means CD only publishes what CI validated. GHCR is the
# *publish* target only (ADR-0001); `make demo` builds and runs the same
# Dockerfile locally with no registry auth.
#
# `uv run make ...` puts the project venv on PATH, so the Makefile's bare
# `python` / `ruff` resolve to the locked environment (uv.lock, --frozen).
name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint + contract + tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run make lint

      - name: Feature-contract check
        run: uv run make contract

      - name: Tests (pytest)
        run: uv run make test

      - name: Validate Compose manifest
        run: docker compose -f deploy/compose.yaml config --quiet

  cd:
    name: build + push serving image
    needs: ci
    # Publish only what CI validated, and only on default-branch pushes (a PR
    # run or feature-branch push must not publish).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Explicit lowercase image name: GHCR requires lowercase, and
      # `github.repository` keeps the repo's uppercase. The serving image is
      # distinct from the local `ieee-fraud-demo:local` tag in compose.yaml.
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ieee-fraud-serving
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Tag by commit: sha-<short-sha> (the ticket's "tagged by commit").
            type=sha,format=short
            # `latest` points at the newest default-branch build.
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
